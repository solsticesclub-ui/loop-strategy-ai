  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dark:     #28190e;
      --dark-2:   #1C1108;
      --cream:    #F5EFE6;
      --muted:    rgba(245,239,230,0.52);
      --gold-line:rgba(255,255,255,0.1);
      --wa:       #7db88e;
      --wa-dk:    #68a87a;
      --radius:   10px;
      --ease:     0.28s ease;
    }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--dark); color: var(--cream);
      line-height: 1.6; min-height: 100dvh;
      display: grid; place-items: center; padding: 32px 24px;
    }
    a { color: inherit; text-decoration: none; }
    .card { max-width: 560px; text-align: center; }
    .tick {
      width: 62px; height: 62px; margin: 0 auto 26px;
      border-radius: 50%; border: 1px solid var(--gold-line);
      display: grid; place-items: center;
    }
    .tick svg { width: 26px; height: 26px; stroke: var(--wa); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .eyebrow {
      display: inline-block; font-size: 0.68rem; letter-spacing: 0.22em;
      text-transform: uppercase; opacity: 0.55; font-weight: 600; margin-bottom: 14px;
    }
    h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 300; line-height: 1.2; margin-bottom: 16px; }
    p { color: var(--muted); font-size: 0.95rem; }
    .actions { margin-top: 34px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 9px;
      padding: 13px 26px; border-radius: 30px;
      font-size: 0.84rem; font-weight: 600; letter-spacing: 0.04em;
      transition: transform var(--ease), background var(--ease);
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-wa { background: var(--wa); color: #fff; }
    .btn-wa:hover { background: var(--wa-dk); }
    .btn-wa svg { width: 18px; height: 18px; fill: #fff; }
    .btn-ghost { border: 1px solid var(--gold-line); color: var(--cream); }
    .btn-ghost:hover { border-color: var(--cream); }
  </style>
